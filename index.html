<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Repo Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #020617;
      padding: 30px;
      border-radius: 12px;
      width: 450px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #0ea5e9;
    }

    .secondary {
      background: #64748b;
    }

    .secondary:hover {
      background: #475569;
    }

    .result {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }

    ul {
      padding-left: 18px;
    }

    li {
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>GitHub Repo Analyzer</h2>

  <input
    id="repoUrl"
    placeholder="https://github.com/username/repo"
  >

  <button onclick="analyze()">Analyze Repo</button>

  <div class="result" id="result"></div>
</div>

<script>
async function analyze() {
  const repoUrl = document.getElementById("repoUrl").value;
  const result = document.getElementById("result");

  if (!repoUrl) {
    result.innerHTML = "❌ Enter a GitHub repo URL";
    return;
  }

  result.innerHTML = "⏳ Analyzing...";

  try {
    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ repo_url: repoUrl })
    });

    const data = await res.json();

    if (data.error) {
      result.innerHTML = "❌ " + data.error;
      return;
    }

    result.innerHTML = `
      <strong>Level:</strong> ${data.level}<br>
      <strong>Total Score:</strong> ${data.score}/100<br><br>

      <strong>Score Breakdown:</strong>
      <ul>
        ${Object.entries(data.breakdown)
          .map(([k,v]) => `<li>${k}: ${v}</li>`)
          .join("")}
      </ul>

      <strong>AI Review:</strong>
      <pre style="white-space:pre-wrap;font-family:inherit;">
${data.ai_review}
      </pre>

      <button onclick="copyResult()">📋 Copy Result</button>
      <button class="secondary" onclick="resetAll()">🔄 Reset</button>
    `;
  } catch (err) {
    result.innerHTML = "❌ Backend not reachable";
  }
}

function copyResult() {
  navigator.clipboard.writeText(
    document.getElementById("result").innerText
  );
  alert("Copied!");
}

function resetAll() {
  document.getElementById("repoUrl").value = "";
  document.getElementById("result").innerHTML = "";
}
</script>

</body>
</html>
